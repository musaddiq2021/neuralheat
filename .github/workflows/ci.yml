name: Scientific checks and CPU smoke experiment
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests scripts
      - run: python scripts/run_experiment.py --config configs/smoke.json --output-root runs/smoke --device cpu --skip-cuda
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-smoke-artifacts
          path: |
            runs/smoke/reports/
            runs/smoke/figures/
            runs/smoke/models/training.json
