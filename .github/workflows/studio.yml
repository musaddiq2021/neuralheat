name: Studio integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  workstation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[studio,dev]"
      # Explicit disposable CI smoke run, never part of opening the dashboard.
      - run: python scripts/run_experiment.py --config configs/smoke.json --device cpu --skip-cuda --skip-tests
      - run: python -m pytest -q
      - run: python -m ruff check src tests scripts
      - run: npm ci --no-fund --no-audit
      - run: npm run typecheck && npm run lint && npm test && npm run build
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          NEURALHEAT_E2E_START_SERVERS: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-browser-and-scientific-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
            reports/
            figures/
